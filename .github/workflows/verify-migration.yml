name: Verify migrated Boundless Cultivation

on:
  push:
    branches: ["migration/sitegpt-standalone", "main", "feature/boundless-v815", "feature/boundless-v815-release", "refactor/modular-architecture"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Release audit
        run: python tools/release_audit.py --root . --write docs/migration/release-audit.md
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Runtime syntax check
        run: |
          node --check site/assets/page-B87MruAb.js
          node --check site/assets/v815-release.js
          node --check site/modules/core/event-bus.js
          node --check site/modules/core/module-registry.js
          node --check site/modules/persistence/save-adapter.js
          node --check site/modules/spirit-beasts/catalogue.js
          node --check site/modules/spirit-beasts/index.js
      - name: Save manager unit tests
        run: node --test tests/save-manager.test.mjs tests/modular-runtime.test.mjs
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:e2e
